<svg viewBox="0 0 1300 1020" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#37474F"/>
    </marker>
    <marker id="arrowRed" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#C62828"/>
    </marker>
    <marker id="arrowGray" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#78909C"/>
    </marker>
  </defs>

  <rect width="1300" height="1020" fill="#FAFAFA"/>

  <text x="650" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#1A237E">Azure Mini Production — 3-Tier Architecture</text>
  <text x="650" y="56" text-anchor="middle" font-size="13" fill="#546E7A">rg-mini-production · South Africa North</text>

  <!-- Internet -->
  <g>
    <ellipse cx="600" cy="100" rx="90" ry="28" fill="#ECEFF1" stroke="#546E7A" stroke-width="1.5"/>
    <ellipse cx="545" cy="95" rx="45" ry="20" fill="#ECEFF1" stroke="#546E7A" stroke-width="1.5"/>
    <ellipse cx="655" cy="95" rx="45" ry="20" fill="#ECEFF1" stroke="#546E7A" stroke-width="1.5"/>
    <text x="600" y="105" text-anchor="middle" font-size="14" font-weight="600" fill="#37474F">INTERNET</text>
  </g>

  <!-- arrow internet -> firewall -->
  <line x1="600" y1="128" x2="600" y2="160" stroke="#37474F" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="615" y="148" font-size="11" fill="#37474F">HTTP/HTTPS</text>

  <!-- Firewall -->
  <rect x="460" y="162" width="280" height="72" rx="8" fill="#FFEBEE" stroke="#C62828" stroke-width="1.5"/>
  <text x="600" y="182" text-anchor="middle" font-size="13" font-weight="700" fill="#B71C1C">Azure Firewall (Standard)</text>
  <text x="600" y="200" text-anchor="middle" font-size="11" fill="#4E342E">Public IP: 20.87.214.176</text>
  <text x="600" y="216" text-anchor="middle" font-size="11" fill="#4E342E">Private IP: 10.0.10.4 · DNAT 80/443 → 10.0.1.4</text>

  <!-- arrow firewall -> web subnet -->
  <line x1="600" y1="234" x2="600" y2="270" stroke="#37474F" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- VNet outer container -->
  <rect x="90" y="270" width="1120" height="680" rx="10" fill="#FFFFFF" stroke="#607D8B" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="110" y="295" font-size="13" font-weight="700" fill="#455A64">Virtual Network: vnet-mini-production (10.0.0.0/16)</text>

  <!-- Bastion subnet -->
  <rect x="900" y="315" width="270" height="110" rx="8" fill="#ECEFF1" stroke="#455A64" stroke-width="1.5"/>
  <text x="1035" y="336" text-anchor="middle" font-size="12" font-weight="700" fill="#37474F">AzureBastionSubnet (10.0.11.0/26)</text>
  <text x="1035" y="356" text-anchor="middle" font-size="11" fill="#37474F">Azure Bastion (Basic SKU)</text>
  <text x="1035" y="374" text-anchor="middle" font-size="11" fill="#546E7A">Browser-based SSH, no VPN needed</text>
  <text x="1035" y="392" text-anchor="middle" font-size="10" fill="#78909C">no NSG on this subnet</text>

  <!-- Web subnet -->
  <rect x="130" y="315" width="640" height="120" rx="8" fill="#E3F2FD" stroke="#1565C0" stroke-width="1.5"/>
  <text x="150" y="336" font-size="12" font-weight="700" fill="#0D47A1">Web Subnet (10.0.1.0/24)</text>
  <text x="150" y="356" font-size="12" font-weight="600" fill="#0D47A1">vm-web — 10.0.1.4 (no public IP)</text>
  <text x="150" y="374" font-size="11" fill="#1A237E">nginx: serves page + reverse-proxies /api/ to App VM</text>
  <text x="150" y="392" font-size="11" fill="#1A237E">nsg-web: allow 80/443 in, allow Bastion SSH, deny rest of VNet</text>
  <text x="150" y="410" font-size="11" fill="#1A237E">rt-web: 0.0.0.0/0 → Firewall (10.0.10.4)</text>
  <text x="150" y="428" font-size="10" fill="#5C6BC0">Azure Monitor Agent + VM Insights enabled</text>

  <!-- Bastion -> web dashed -->
  <line x1="900" y1="360" x2="770" y2="370" stroke="#78909C" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arrowGray)"/>
  <text x="800" y="356" font-size="10" fill="#78909C">SSH 22 (admin)</text>

  <!-- arrow web -> app -->
  <line x1="450" y1="435" x2="450" y2="470" stroke="#37474F" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="465" y="456" font-size="11" fill="#37474F">TCP 8080 (Web → App only)</text>

  <!-- App subnet -->
  <rect x="130" y="472" width="640" height="120" rx="8" fill="#E8F5E9" stroke="#2E7D32" stroke-width="1.5"/>
  <text x="150" y="493" font-size="12" font-weight="700" fill="#1B5E20">App Subnet (10.0.2.0/24)</text>
  <text x="150" y="513" font-size="12" font-weight="600" fill="#1B5E20">vm-app — 10.0.2.4 (no public IP)</text>
  <text x="150" y="531" font-size="11" fill="#1B5E20">Flask + Gunicorn (2 workers), managed by systemd (app.service)</text>
  <text x="150" y="549" font-size="11" fill="#1B5E20">System-Assigned Managed Identity — no hardcoded credentials</text>
  <text x="150" y="567" font-size="11" fill="#1B5E20">nsg-app: allow 8080 from Web, allow Bastion SSH, deny rest of VNet</text>
  <text x="150" y="585" font-size="10" fill="#43A047">rt-app: 0.0.0.0/0 → Firewall (10.0.10.4) · VM Insights enabled</text>

  <!-- Bastion -> app dashed -->
  <line x1="900" y1="400" x2="770" y2="530" stroke="#78909C" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arrowGray)"/>
  <text x="800" y="470" font-size="10" fill="#78909C">SSH 22 (admin)</text>

  <!-- arrow app -> data -->
  <line x1="450" y1="592" x2="450" y2="627" stroke="#37474F" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="465" y="613" font-size="11" fill="#37474F">HTTPS 443 (App → Data only)</text>

  <!-- Data subnet -->
  <rect x="130" y="629" width="640" height="130" rx="8" fill="#F3E5F5" stroke="#6A1B9A" stroke-width="1.5"/>
  <text x="150" y="650" font-size="12" font-weight="700" fill="#4A148C">Data Subnet (10.0.3.0/24)</text>
  <text x="150" y="670" font-size="12" font-weight="600" fill="#4A148C">Private Endpoint — 10.0.3.4</text>
  <text x="150" y="688" font-size="11" fill="#4A148C">→ Storage Account "stminiprod" · Blob container "app-data"</text>
  <text x="150" y="706" font-size="11" fill="#4A148C">Public network access: DISABLED · reachable via VNet only</text>
  <text x="150" y="724" font-size="11" fill="#4A148C">nsg-data: allow from App only, deny rest of VNet</text>
  <text x="150" y="742" font-size="10" fill="#8E24AA">Private Endpoint Network Policies: Enabled (NSG actually enforced)</text>

  <!-- Web -x-> Data blocked -->
  <path d="M 790 375 C 900 500, 900 650, 790 700" fill="none" stroke="#C62828" stroke-width="1.5" stroke-dasharray="3,4" marker-end="url(#arrowRed)"/>
  <text x="920" y="540" font-size="10" fill="#C62828" font-weight="600">Web → Data</text>
  <text x="920" y="554" font-size="10" fill="#C62828" font-weight="600">BLOCKED (tested ✕)</text>

  <!-- Firewall subnet note -->
  <rect x="900" y="440" width="270" height="70" rx="8" fill="#FFEBEE" stroke="#C62828" stroke-width="1.5"/>
  <text x="1035" y="461" text-anchor="middle" font-size="12" font-weight="700" fill="#B71C1C">AzureFirewallSubnet (10.0.10.0/26)</text>
  <text x="1035" y="479" text-anchor="middle" font-size="10" fill="#4E342E">Firewall's internal (private) side</text>
  <text x="1035" y="495" text-anchor="middle" font-size="10" fill="#4E342E">All subnet egress routes here first</text>

  <!-- outbound rules box -->
  <rect x="900" y="530" width="270" height="90" rx="8" fill="#FFF3E0" stroke="#EF6C00" stroke-width="1.5"/>
  <text x="1035" y="551" text-anchor="middle" font-size="12" font-weight="700" fill="#E65100">Firewall Policy — Outbound</text>
  <text x="1035" y="571" text-anchor="middle" font-size="10" fill="#4E342E">Network rule: DNS → 168.63.129.16</text>
  <text x="1035" y="588" text-anchor="middle" font-size="10" fill="#4E342E">App rule: *.ubuntu.com, pypi.org,</text>
  <text x="1035" y="604" text-anchor="middle" font-size="10" fill="#4E342E">files.pythonhosted.org (allow-listed only)</text>

  <!-- Monitoring -->
  <rect x="900" y="640" width="270" height="130" rx="8" fill="#FFFDE7" stroke="#F9A825" stroke-width="1.5"/>
  <text x="1035" y="661" text-anchor="middle" font-size="12" font-weight="700" fill="#F57F17">Log Analytics Workspace</text>
  <text x="1035" y="679" text-anchor="middle" font-size="11" fill="#4E342E">law-mini-production</text>
  <text x="1035" y="697" text-anchor="middle" font-size="10" fill="#4E342E">VM Insights via Azure Monitor Agent</text>
  <text x="1035" y="713" text-anchor="middle" font-size="10" fill="#4E342E">14 alert rules: CPU, network,</text>
  <text x="1035" y="729" text-anchor="middle" font-size="10" fill="#4E342E">disk IOPS, VM availability</text>
  <text x="1035" y="750" text-anchor="middle" font-size="10" fill="#F9A825">(both VMs report here)</text>

  <!-- dashed monitoring arrows -->
  <path d="M 770 380 C 850 450, 850 600, 900 680" fill="none" stroke="#F9A825" stroke-width="1.3" stroke-dasharray="4,4" marker-end="url(#arrowGray)"/>
  <path d="M 770 540 C 830 580, 850 620, 900 690" fill="none" stroke="#F9A825" stroke-width="1.3" stroke-dasharray="4,4" marker-end="url(#arrowGray)"/>

  <!-- Legend -->
  <rect x="130" y="790" width="1040" height="140" rx="8" fill="#FFFFFF" stroke="#B0BEC5" stroke-width="1"/>
  <text x="150" y="812" font-size="12" font-weight="700" fill="#37474F">Legend</text>

  <line x1="150" y1="830" x2="200" y2="830" stroke="#37474F" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="210" y="834" font-size="11" fill="#37474F">Application traffic (allowed, tested working)</text>

  <line x1="150" y1="855" x2="200" y2="855" stroke="#C62828" stroke-width="1.5" stroke-dasharray="3,4" marker-end="url(#arrowRed)"/>
  <text x="210" y="859" font-size="11" fill="#37474F">Blocked path (tested — confirmed denied)</text>

  <line x1="150" y1="880" x2="200" y2="880" stroke="#78909C" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arrowGray)"/>
  <text x="210" y="884" font-size="11" fill="#37474F">Admin access via Bastion (SSH 22 only)</text>

  <line x1="500" y1="830" x2="550" y2="830" stroke="#F9A825" stroke-width="1.3" stroke-dasharray="4,4" marker-end="url(#arrowGray)"/>
  <text x="560" y="834" font-size="11" fill="#37474F">Metrics/logs → Log Analytics</text>

  <text x="500" y="859" font-size="11" fill="#37474F">🔒 No VM in this architecture has a public IP</text>
  <text x="500" y="884" font-size="11" fill="#37474F">🔑 App tier authenticates to Storage via Managed Identity (no keys/secrets)</text>

  <text x="150" y="912" font-size="10" fill="#90A4AE">Every arrow above represents a connection that was actually tested against the live environment — see README for details.</text>
</svg>
